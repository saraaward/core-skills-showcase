name: Reference example checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run synthetic approval-gate regression cases
        run: python3 -m unittest discover -s tests -v
      - name: Run the documented example
        run: python3 examples/approval_gate.py
